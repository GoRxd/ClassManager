<app-header title="Settings" backDefaultHref="/home"></app-header>

<ion-content [fullscreen]="true">


  <ion-list inset="true">
    <ion-item-group>
      <ion-item-divider>
        <ion-label>Appearance</ion-label>
      </ion-item-divider>
      
      <ion-item lines="none">
        <ion-icon slot="start" name="moon-outline" ></ion-icon>
        <ion-label>Theme</ion-label>
        <ion-select slot="end" [value]="theme()" (ionChange)="updateTheme($event)" interface="popover">
          <ion-select-option value="dark">Dark</ion-select-option>
          <ion-select-option value="light">Light</ion-select-option>
          <ion-select-option value="auto">System (Auto)</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-item-group>

    <ion-item-group>
      <ion-item-divider>
        <ion-label>Regional</ion-label>
      </ion-item-divider>

      <ion-item lines="none">
        <ion-icon slot="start" name="cash-outline"></ion-icon>
        <ion-label>Currency</ion-label>
        <ion-select slot="end" [value]="currency()" (ionChange)="changeCurrency($event)" placeholder="Select Currency">
          <ion-select-option *ngFor="let curr of availableCurrencies" [value]="curr">
            {{ curr }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </ion-item-group>

    <ion-item-group>
      <ion-item-divider>
        <ion-label>About</ion-label>
      </ion-item-divider>
      
      <ion-item button detail="false" lines="none">
        <ion-label>
          <h3>App Version</h3>
          <p>0.0.1 (Alpha)</p>
        </ion-label>
      </ion-item>
    </ion-item-group>
  </ion-list>
</ion-content>
