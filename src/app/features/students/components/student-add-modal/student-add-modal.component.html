<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ (isEditing ? 'STUDENTS.EDIT_STUDENT' : 'STUDENTS.ADD_STUDENT') | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-inputs">
    <ion-input [label]=" 'STUDENTS.FIRST_NAME' | translate " labelPlacement="floating" fill="outline"
      [(ngModel)]="newName" [placeholder]="('COMMON.E_G' | translate) + ' Jan'">
    </ion-input>

    <ion-input [label]=" 'STUDENTS.LAST_NAME' | translate " labelPlacement="floating" fill="outline"
      [(ngModel)]="newLastname" [placeholder]="('COMMON.E_G' | translate) + ' Kowalski'">
    </ion-input>

    <ion-input [label]=" 'STUDENTS.PHONE' | translate " labelPlacement="floating" fill="outline" type="tel"
      inputmode="tel" [(ngModel)]="newPhone" [placeholder]="('COMMON.E_G' | translate) + ' 123 456 789'"
      [color]="isPhoneValid ? 'success' : (newPhone ? 'danger' : 'medium')">
      <ion-icon slot="start" name="call-outline" aria-hidden="true"></ion-icon>
    </ion-input>

    <ion-button expand="block" size="large" (click)="confirm()" [disabled]="!canSave" class="save-btn">
      <ion-icon slot="start" [name]="isEditing ? 'create-outline' : 'person-add-outline'"></ion-icon>
      {{ (isEditing ? 'COMMON.SAVE' : 'COMMON.ADD') | translate }}
    </ion-button>
  </div>
</ion-content>
