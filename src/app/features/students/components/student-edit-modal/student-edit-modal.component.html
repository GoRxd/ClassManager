<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Edit student</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-inputs">
    
    <ion-input 
      label="First name"
      labelPlacement="floating"
      fill="outline"
      [(ngModel)]="localStudent.firstName" 
      placeholder="First name">
    </ion-input>

    <ion-input 
      label="Last name"
      labelPlacement="floating"
      fill="outline"
      [(ngModel)]="localStudent.lastName" 
      placeholder="Last name">
    </ion-input>

    <ion-input 
      label="Phone"
      labelPlacement="floating"
      fill="outline"
      [(ngModel)]="localStudent.phone" 
      type="tel" 
      placeholder="Phone"
      helperText="Format: 9 digits"
    >
      <ion-icon slot="start" name="call-outline"></ion-icon>
    </ion-input>

    <ion-button expand="block" size="large" (click)="confirm()" [disabled]="!isValid" class="save-btn">
      <ion-icon slot="start" name="save-outline"></ion-icon>
      Save changes
    </ion-button>
    
  </div>
</ion-content>
