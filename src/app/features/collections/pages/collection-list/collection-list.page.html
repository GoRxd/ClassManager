<app-header title="Collections" [isRoot]="true">
  <ion-buttons slot="end">
    <!-- <ion-button (click)="presentAddModal()">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button> -->
  </ion-buttons>
</app-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <app-search></app-search>

  @if (filteredCollections().length === 0) {
  <app-empty-state icon="wallet-outline" title="No collections found"
    description="Create a new collection to start tracking payments.">
  </app-empty-state>
  } @else {
  <div class="page-header">
    <h2>Active Collections</h2>
  </div>

  <ion-list lines="none" class="section-margin" style="background: transparent; padding: 0 var(--app-side-padding);">
    @for (col of filteredCollections(); track col.id) {
    <ion-item-sliding #slidingItem class="app-card">
      <ion-item-options side="start" (ionSwipe)="edit(col, slidingItem)">
        <ion-item-option color="primary" expandable (click)="edit(col, slidingItem)">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>

      <ion-item lines="none" class="ion-no-padding"
        style="--background: transparent; --padding-start: 0; --inner-padding-end: 0;">
        <ion-card class="collection-card ion-no-margin" style="width: 100%; box-shadow: none;"
          [class.is-overdue]="isOverdue(col)" [routerLink]="['/collections', col.id]">
          <ion-card-header>
            <ion-card-title>{{ col.title }}</ion-card-title>
            <ion-card-subtitle>
              <span class="deadline" *ngIf="col.deadline">
                <ion-icon name="time-outline"></ion-icon>
                {{ col.deadline * 1000 | date:'mediumDate' }}
              </span>
              <span class="deadline" *ngIf="!col.deadline">No deadline</span>

              <span class="amount">{{ col.targetAmount | money }}</span>
            </ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>{{ col.description || 'No description' }}</p>
            <!-- Placeholder for progress, logic to calculate collected vs target needed later -->
            <!-- <ion-progress-bar value="0.5" color="primary"></ion-progress-bar> -->
          </ion-card-content>
        </ion-card>
      </ion-item>

      <ion-item-options side="end" (ionSwipe)="confirmDelete(col.id, slidingItem)">
        <ion-item-option color="danger" expandable (click)="confirmDelete(col.id, slidingItem)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
    }
  </ion-list>
  }
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="presentAddModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
