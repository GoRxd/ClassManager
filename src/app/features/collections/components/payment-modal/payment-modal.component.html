<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Record Payment</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="modal-content">
    <ion-note color="medium">
        Student: <strong>{{ studentName }}</strong>
    </ion-note>

    <ion-input
        label="Amount (PLN)"
        labelPlacement="floating"
        fill="outline"
        type="number"
        inputmode="decimal"
        [(ngModel)]="amount"
        placeholder="0.00"
    ></ion-input>

    <div class="hints" *ngIf="suggestedAmount > 0">
        <ion-chip (click)="amount = suggestedAmount" color="secondary">
            <ion-label>Use Default: {{ suggestedAmount | number:'1.2-2' }}</ion-label>
        </ion-chip>
    </div>

    <ion-button expand="block" (click)="confirm()" [disabled]="amount < 0">
        <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
        Confirm Payment
    </ion-button>
  </div>
</ion-content>
