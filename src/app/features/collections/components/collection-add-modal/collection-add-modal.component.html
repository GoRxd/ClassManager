<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ (isEditing ? 'COLLECTIONS.EDIT_COLLECTION' : 'COLLECTIONS.ADD_COLLECTION') | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-inputs">

    <ion-input [label]=" 'COLLECTIONS.COLLECTION_NAME' | translate " labelPlacement="floating" fill="outline"
      [(ngModel)]="title" [placeholder]=" 'COLLECTIONS.TITLE_PLACEHOLDER' | translate ">
    </ion-input>

    <ion-textarea [label]=" 'EXPENSES.DESCRIPTION' | translate " labelPlacement="floating" fill="outline"
      [(ngModel)]="description" [placeholder]=" 'COMMON.NO_DATA' | translate " rows="3">
    </ion-textarea>

    <ion-input [label]=" 'COLLECTIONS.TOTAL_AMOUNT' | translate:{ currency: currency() } " labelPlacement="floating"
      fill="outline" type="number" inputmode="decimal" [(ngModel)]="amount" placeholder="0.00">
    </ion-input>

    <ion-input [label]=" 'COLLECTIONS.DEADLINE' | translate " labelPlacement="floating" fill="outline" type="date"
      [(ngModel)]="deadline">
    </ion-input>

    <ion-button expand="block" size="large" (click)="confirm()" [disabled]="!canSave" class="save-btn">
      <ion-icon slot="start" [name]="isEditing ? 'save-outline' : 'add-circle-outline'"></ion-icon>
      {{ (isEditing ? 'COMMON.SAVE' : 'COMMON.ADD') | translate }}
    </ion-button>

  </div>
</ion-content>
