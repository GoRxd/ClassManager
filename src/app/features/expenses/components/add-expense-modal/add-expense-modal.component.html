<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ expense ? 'Edit Expense' : 'Add Expense' }}</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="confirm()" [strong]="true" [disabled]="!selectedCollectionId || !title || !amount">Save</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-select label="Collection" label-placement="floating" [(ngModel)]="selectedCollectionId" placeholder="Select Collection">
        @for (coll of collectionService.collections(); track coll.id) {
          <ion-select-option [value]="coll.id">{{ coll.title }}</ion-select-option>
        }
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-input label="Title" label-placement="floating" [(ngModel)]="title" placeholder="e.g. Bus Tickets"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Amount (PLN)" label-placement="floating" type="number" [(ngModel)]="amount" placeholder="0.00"></ion-input>
    </ion-item>
  </ion-list>

  <ion-list>
    <ion-item lines="none" color="light">
      <ion-label class="ion-text-uppercase font-bold">Products (Optional)</ion-label>
      <ion-button (click)="addProduct()" size="small" slot="end" fill="solid">
        <ion-icon name="add" slot="start"></ion-icon>
        Add Item
      </ion-button>
    </ion-item>

    @for (p of products; track $index) {
      <ion-item>
        <ion-grid class="ion-no-padding">
          <ion-row class="ion-align-items-center">
            <ion-col size="5">
              <ion-input label="Name" label-placement="stacked" [(ngModel)]="p.name" placeholder="Item"></ion-input>
            </ion-col>
            <ion-col size="2">
              <ion-input label="Qty" label-placement="stacked" type="number" [(ngModel)]="p.quantity" (ionInput)="updateTotal()"></ion-input>
            </ion-col>
            <ion-col size="3">
              <ion-input label="Price" label-placement="stacked" type="number" [(ngModel)]="p.unitPrice" (ionInput)="updateTotal()"></ion-input>
            </ion-col>
            <ion-col size="2" class="ion-text-end">
              <ion-button fill="clear" color="danger" (click)="removeProduct($index)">
                <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
              </ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>
    }

    @if (products.length === 0) {
      <ion-item lines="none">
        <ion-label color="medium" class="ion-text-center">No products added. Enter total manually.</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
