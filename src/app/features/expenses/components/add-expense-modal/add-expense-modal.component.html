<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ expense ? 'Edit Expense' : 'Add Expense' }}</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="confirm()" [strong]="true"
        [disabled]="!selectedCollectionId || !title || !amount || amount <= 0">Save</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-inputs">
    <div class="input-group">
      <ion-select label="Collection" label-placement="floating" fill="outline" [(ngModel)]="selectedCollectionId"
        placeholder="Select Collection">
        @for (coll of collectionService.collections(); track coll.id) {
        <ion-select-option [value]="coll.id">{{ coll.title }}</ion-select-option>
        }
      </ion-select>
    </div>

    <div class="input-group">
      <ion-input label="Title" label-placement="floating" fill="outline" [(ngModel)]="title"
        placeholder="e.g. Bus Tickets"></ion-input>
    </div>

    <div class="input-group">
      <ion-textarea label="Description" label-placement="floating" fill="outline" [(ngModel)]="description"
        placeholder="Optional details..." auto-grow="true" rows="2"></ion-textarea>
    </div>

    <div class="input-group">
      <ion-input [label]="'Amount (' + currency() + ')'" label-placement="floating" fill="outline" type="number"
        [(ngModel)]="amount" placeholder="0.00"></ion-input>
    </div>
  </div>

  <div class="products-section">
    <div class="section-header">
      <ion-label class="ion-text-uppercase font-bold">Products (Optional)</ion-label>
      <ion-button (click)="addProduct()" size="small" fill="solid">
        <ion-icon name="add" slot="start"></ion-icon>
        Add Item
      </ion-button>
    </div>

    <div class="products-list">
      @for (p of products; track $index) {
      <div class="product-item">
        <ion-grid class="ion-no-padding">
          <ion-row class="ion-align-items-center">
            <ion-col size="5">
              <ion-input label="Name" label-placement="stacked" fill="outline" [(ngModel)]="p.name"
                placeholder="Item"></ion-input>
            </ion-col>
            <ion-col size="2">
              <ion-input label="Qty" label-placement="stacked" fill="outline" type="number" [(ngModel)]="p.quantity"
                (ionInput)="updateTotal()"></ion-input>
            </ion-col>
            <ion-col size="3">
              <ion-input label="Price" label-placement="stacked" fill="outline" type="number" [(ngModel)]="p.unitPrice"
                (ionInput)="updateTotal()"></ion-input>
            </ion-col>
            <ion-col size="2" class="ion-text-end">
              <ion-button fill="clear" color="danger" (click)="removeProduct($index)">
                <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
              </ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
      }

      @if (products.length === 0) {
      <div class="empty-products ion-padding ion-text-center">
        <ion-note color="medium">No products added. Enter total manually.</ion-note>
      </div>
      }
    </div>
  </div>
</ion-content>
