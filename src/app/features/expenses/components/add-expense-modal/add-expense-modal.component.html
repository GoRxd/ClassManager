<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ expense ? 'Edit Expense' : 'Add Expense' }}</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="confirm()" [strong]="true" [disabled]="!selectedCollectionId || !title || !amount">Save</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-select label="Collection" label-placement="floating" [(ngModel)]="selectedCollectionId" placeholder="Select Collection">
        @for (coll of collectionService.collections(); track coll.id) {
          <ion-select-option [value]="coll.id">{{ coll.title }}</ion-select-option>
        }
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-input label="Title" label-placement="floating" [(ngModel)]="title" placeholder="e.g. Bus Tickets"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Amount (PLN)" label-placement="floating" type="number" [(ngModel)]="amount" placeholder="0.00"></ion-input>
    </ion-item>
  </ion-list>
</ion-content>
